name: Update portfolio and deploy Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '13,28,43,58 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Restore last successful portfolio quotes
        uses: actions/cache/restore@v4
        with:
          path: data/portfolio-cache.json
          key: ${{ runner.os }}-portfolio-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-portfolio-
      - run: pnpm install --frozen-lockfile
      - name: Update market data
        run: pnpm update:data
        env:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
      - name: Save successful portfolio quotes
        uses: actions/cache/save@v4
        with:
          path: data/portfolio-cache.json
          key: ${{ runner.os }}-portfolio-${{ github.run_id }}
      - run: pnpm build
      - name: Normalize GitHub Pages asset paths
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mv "dist/client/${repo_name}/_next" dist/client/_next
          rmdir "dist/client/${repo_name}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
