name: Update portfolio and deploy Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '4 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Restore last successful portfolio quotes
        uses: actions/cache/restore@v4
        with:
          path: data/portfolio-cache.json
          key: ${{ runner.os }}-portfolio-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-portfolio-
      - run: pnpm install --frozen-lockfile
      - name: Verify quote validation
        run: node --test scripts/uniswap-quotes.test.mjs
      - name: Update market data
        run: pnpm update:data
        env:
          UNISWAP_API_KEY: ${{ secrets.UNISWAP_API_KEY }}
          QUOTE_DIAGNOSTICS: ${{ github.event_name == 'push' && 'true' || 'false' }}
      - name: Upload quote diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: quote-diagnostics
          path: data/quote-diagnostics.json
          if-no-files-found: ignore
      - name: Save successful portfolio quotes
        uses: actions/cache/save@v4
        with:
          path: data/portfolio-cache.json
          key: ${{ runner.os }}-portfolio-${{ github.run_id }}
      - run: pnpm build
      - name: Normalize GitHub Pages asset paths
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mv "dist/client/${repo_name}/_next" dist/client/_next
          rmdir "dist/client/${repo_name}"
      - name: Publish machine-readable portfolio snapshot
        run: |
          cp data/portfolio.json dist/client/portfolio.json
          if [ -f data/quote-diagnostics.json ]; then
            cp data/quote-diagnostics.json dist/client/quote-diagnostics.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
